<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ФитПульс — фитнес-студия: онлайн-запись на групповые тренировки.">
  <title>Мои заявки — ФитПульс</title>
  <link rel="icon" href="img/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cabinet">
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html"><img src="img/logo.svg" alt="" width="34" height="34"><span>ФитПульс</span></a>
      <nav class="nav" id="nav" aria-label="Основная навигация"></nav>
    </div>
  </header>
  <main id="main" class="main">
    <section class="container two-col">
      <div class="panel">
        <h1>Новая заявка</h1>
        <form id="requestForm" class="form" novalidate>
          <div class="field"><label for="training">Тренировка</label><select id="training" name="training" required><option value="">— выберите тренировку —</option></select><small class="field__error"></small></div>
          <div class="row">
            <div class="field"><label for="date">Дата</label><input id="date" name="date" type="date" required><small class="field__error"></small></div>
            <div class="field"><label for="time">Время</label><select id="time" name="time" required><option>09:00</option><option>10:00</option><option>18:00</option><option>19:00</option><option>20:00</option></select><small class="field__error"></small></div>
          </div>
          <fieldset class="field"><legend>Способ оплаты</legend>
            <div class="chips">
              <label class="chip"><input type="radio" name="payment" value="card" checked> Картой</label>
              <label class="chip"><input type="radio" name="payment" value="cash"> Наличными</label>
              <label class="chip"><input type="radio" name="payment" value="transfer"> Переводом</label>
            </div></fieldset>
          <div class="field"><label for="comment">Комментарий</label><textarea id="comment" name="comment" rows="2" maxlength="255" placeholder="Пожелания тренеру"></textarea></div>
          <button class="btn btn--block" type="submit">Отправить заявку</button>
        </form>
      </div>
      <div>
        <h2 class="h2-top">Мои заявки</h2>
        <ul class="list" id="myRequests"></ul>
      </div>
    </section>
  </main>
  <footer class="footer"><div class="container">© 2026 ФитПульс — студия групповых тренировок</div></footer>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
